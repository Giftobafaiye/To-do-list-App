<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Doable_ — a to-do list app with priorities, due dates, reminders, calendar sync, sub-tasks and collaborators.">
  <meta name="theme-color" content="#DD6031">
  <title>Doable_ — To-do list</title>

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

  <!-- Fonts: a grotesk for text and a typewriter mono for small labels, matching the design reference -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to tasks</a>

  <div class="app">
    <aside id="sidebar" class="sidebar" aria-label="Navigation"></aside>
    <div class="sidebar-backdrop" data-action="close-sidebar"></div>
    <main id="main" class="main"></main>
  </div>

  <div id="drawer-root"></div>
  <div id="modal-root"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <input id="import-file" type="file" accept="application/json,.json" hidden>

  <noscript><p class="noscript">Doable_ needs JavaScript switched on to run.</p></noscript>

  <!--
    Scripts are plain (non-module) files so the app works by double-clicking index.html.
    Order matters: each file can use the ones loaded before it.
  -->
  <script src="js/icons.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/store.js"></script>
  <script src="js/parser.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
